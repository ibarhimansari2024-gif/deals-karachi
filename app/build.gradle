plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sajid.dealskarachi'
    compileSdk 35

    defaultConfig {
        applicationId "com.sajid.dealskarachi"
        minSdk 24
        targetSdk 35
        versionCode 19
        versionName "4.3"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
