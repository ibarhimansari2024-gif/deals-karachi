name: Daily data update

on:
  schedule:
    - cron: '*/10 * * * *'   # har 10 min — backend active, taaza deals din bhar (public repo = free)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run real ingestion (Node.js backend — YouTube + brandtijara + Shopify)
        run: node ingest/ingest.js

      - name: Commit refreshed feed
        run: |
          git config user.name "pulse-bot"
          git config user.email "pulse-bot@users.noreply.github.com"
          git add data/deals.json data/channel_ids.json
          git diff --cached --quiet || git commit -m "daily data refresh $(date -u +%F)"
          git push
