name: Daily data update

on:
  schedule:
    - cron: '0 3 * * *'   # 8 AM Pakistan time — daily
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run real ingestion (YouTube RSS + curated)
        run: python3 ingest/ingest.py

      - name: Commit refreshed feed
        run: |
          git config user.name "pulse-bot"
          git config user.email "pulse-bot@users.noreply.github.com"
          git add data/deals.json data/channel_ids.json
          git diff --cached --quiet || git commit -m "daily data refresh $(date -u +%F)"
          git push
