name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DealsKarachi-v1.0-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DealsKarachi-APK
          path: DealsKarachi-v1.0-debug.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0
          files: DealsKarachi-v1.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
